name: Test

on:
  push:
    branches:
      - main
      - beta
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/*.yml"

  pull_request:
    branches:
      - main
      - beta
      - 'feature/**'
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/*.yml"

jobs:

# ──────────────────────────────────────────────────────────────
#  Lint
# ──────────────────────────────────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4

# ──────────────────────────────────────────────────────────────
#  Test
# ──────────────────────────────────────────────────────────────

  test:
    name: Test (Go ${{ matrix.name }})
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: minimum
            go-version-file: go.mod
          - name: stable
            go-version: stable

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go ${{ matrix.name }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          PKGS=$(go list ./... | grep -Ev '/examples/|/internal/testutil')
          COVERPKGS=$(echo "$PKGS" | tr '\n' ',')
          go test $PKGS -race -coverpkg=${COVERPKGS%,} -coverprofile=coverage.txt -covermode=atomic

      - name: Upload coverage to Codecov
        if: matrix.name == 'stable'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt


# ──────────────────────────────────────────────────────────────
#  Vulnerability check
# ──────────────────────────────────────────────────────────────

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest

    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0


# ──────────────────────────────────────────────────────────────
#  Notification
# ──────────────────────────────────────────────────────────────

  notification:
    name: Notification
    needs:
      - lint
      - test
      - vulncheck
    if: |
      always() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Slack Workflow Notification
        uses: Gamesight/slack-workflow-status@2e709ce51fd47f02b7221db8547e6e6f49f81f1d # v2.0.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
