name: Check API Compatibility

on:
  pull_request:
    branches:
      - main
      - beta
      - 'feature/**'
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/check-api-compat.yml"

jobs:
  apidiff:
    name: apidiff
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check out head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261113113407-e3970619a1a4

      - name: Compare public API
        id: apidiff
        run: |
          MODULE=$(cd head && go list -m)
          (cd base && apidiff -m -w "$RUNNER_TEMP/base.export" "$MODULE")
          (cd head && apidiff -m -w "$RUNNER_TEMP/head.export" "$MODULE")
          apidiff -m -incompatible "$RUNNER_TEMP/base.export" "$RUNNER_TEMP/head.export" > "$RUNNER_TEMP/apidiff.txt"

          if [ -s "$RUNNER_TEMP/apidiff.txt" ]; then
            echo "incompatible=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Incompatible API changes"
              echo
              echo '```'
              cat "$RUNNER_TEMP/apidiff.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/apidiff.txt"
          else
            echo "incompatible=false" >> "$GITHUB_OUTPUT"
            echo "No incompatible API changes." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The "breaking change" label is applied by label-pr.yml using GITHUB_TOKEN,
      # which does not trigger a new run. The title "!" is checked as well so the
      # result does not depend on label timing; label-pr.yml keeps the label in
      # line with the title.
      - name: Require breaking change declaration
        if: steps.apidiff.outputs.incompatible == 'true'
        run: |
          if [[ "$PR_TITLE" =~ ^[a-z]+! ]] || echo "$PR_LABELS" | jq -e 'index("breaking change")' > /dev/null; then
            echo "Incompatible changes are declared as a breaking change."
            exit 0
          fi
          echo "::error::Incompatible API changes found, but the PR is not marked as a breaking change. Add \"!\" to the PR title, the \"breaking change\" label and a \"BREAKING CHANGE:\" footer."
          exit 1
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
